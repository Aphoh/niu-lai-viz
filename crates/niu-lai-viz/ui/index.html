<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NIU-LAI-VIZ</title>
<style>
:root {
  --grass: #5c9a2c; --grass-d: #2f5a14; --moss: #9ccc3c; --fur: #e8b923; --fur-d: #a87a10;
  --fur-l: #fff08a; --snout: #f49ab8; --snout-d: #c0507a; --bark: #6b4423; --bark-d: #3b2310;
  --sky: #8fd0e8; --ink: #24140a; --paper: #f6e7a6;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: bold 13px/1.25 "Courier New", Courier, monospace; color: var(--ink); background: var(--grass-d);
  overflow: hidden; display: flex; flex-direction: column; }
canvas { image-rendering: pixelated; }
#bg { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; }
.bevel { background: var(--fur); border: 4px solid; border-color: var(--fur-l) var(--bark-d) var(--bark-d) var(--fur-l);
  box-shadow: 5px 5px 0 rgba(36, 20, 10, .75); }
.pit { background: var(--paper); border: 3px solid; border-color: var(--bark-d) var(--fur-l) var(--fur-l) var(--bark-d); }
button, input, select { font: inherit; color: var(--ink); background: var(--snout); padding: 2px 8px; cursor: pointer;
  border: 3px solid; border-color: #ffd3e2 var(--snout-d) var(--snout-d) #ffd3e2; border-radius: 0; }
button:active { border-color: var(--snout-d) #ffd3e2 #ffd3e2 var(--snout-d); }
input[type=text], input[type=number] { background: var(--paper); cursor: text; border-color: var(--bark-d) var(--fur-l) var(--fur-l) var(--bark-d); }
header { display: flex; align-items: center; gap: 14px; padding: 6px 12px; margin: 8px; flex-wrap: wrap; transition: margin-top .3s steps(6); }
body.hdr-hidden header { margin-top: calc(-1 * var(--hdr-h, 120px)); }
body.noside aside { display: none; }
#sidetog { font-size: 16px; padding: 0 6px; align-self: stretch; }
.panel.wide { grid-column: 1 / -1; height: 440px; }
.ptitle { cursor: grab; } .panel.dragging { opacity: .4; }
.panel.drop-before { box-shadow: -8px 0 0 #ff00ff, 5px 5px 0 rgba(36,20,10,.75); } .panel.drop-after { box-shadow: 8px 0 0 #ff00ff, 5px 5px 0 rgba(36,20,10,.75); }
.ptitle .sbtn { min-width: 52px; } .ptitle .ybtn.on { background: #ff00ff; color: #fff; }
#ydlg { padding: 10px; min-width: 300px; } #ydlg::backdrop { background: rgba(47, 90, 20, .55); }
#ydlg form { display: flex; flex-direction: column; gap: 8px; } #ydlg label { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
#ydlg h2 { word-break: break-all; } #ydlg input, #ydlg select { width: 160px; }
#logo { width: 84px; height: 84px; }
.brand { display: flex; flex-direction: column; gap: 14px; padding-right: 14px; }
h1 { margin: 0; font: 900 40px/1 Impact, "Arial Black", sans-serif; letter-spacing: 2px; color: var(--snout);
  transform: skewX(-12deg) rotate(-2deg); transform-origin: left bottom;
  text-shadow: 3px 3px 0 var(--bark-d), 6px 6px 0 var(--grass), 9px 9px 0 #ff00ff; }
.tag { font-size: 12px; color: var(--bark-d); background: var(--fur-l); padding: 1px 6px; align-self: flex-start;
  border: 2px dashed var(--bark); transform: rotate(.7deg); }
.ctl { display: grid; grid-template-columns: auto auto auto auto; gap: 4px 6px; align-items: center; padding: 6px; }
.ctl label { color: var(--fur-l); background: var(--bark); padding: 1px 6px; text-shadow: 1px 1px 0 #000; }
.ctl input[type=text] { width: 200px; } .ctl input[type=number] { width: 80px; }
#live { margin-left: auto; padding: 4px 10px; background: var(--grass-d); color: var(--moss); font-size: 18px; }
#live.on { color: #ff2a00; background: #000; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { color: var(--fur); } }
main { flex: 1; display: flex; gap: 10px; padding: 0 8px 8px; min-height: 0; }
aside { width: 330px; flex: none; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
aside > section { padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
#runs-sec { flex: 1.1; } #metrics-sec { flex: 1; }
h2 { margin: 0; font-size: 14px; text-transform: uppercase; color: var(--fur-l); background: var(--bark); padding: 2px 6px;
  text-shadow: 2px 2px 0 #000; display: flex; justify-content: space-between; }
h2 small { color: var(--moss); }
.vlist { overflow-y: auto; flex: 1; min-height: 60px; position: relative; contain: strict; }
.vlist > .spacer { position: absolute; left: 0; top: 0; width: 1px; }
.vrow { position: absolute; left: 0; right: 0; height: 32px; padding: 2px 4px; overflow: hidden; white-space: nowrap;
  border-bottom: 2px dotted var(--fur-d); cursor: pointer; contain: strict; }
.vrow:hover { background: var(--moss); }
.vrow.on { background: var(--snout); }
.run .top { display: flex; gap: 6px; align-items: center; }
.run .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.swatch { width: 12px; height: 12px; border: 2px solid var(--ink); flex: none; }
.status { font-size: 10px; padding: 0 4px; border: 2px solid var(--ink); }
.status.running { background: #ff2a00; color: #fff; } .status.finished { background: var(--grass); color: var(--fur-l); }
.status.stale, .status.failed { background: #777; color: #ddd; text-decoration: line-through; }
.labels { font-size: 11px; color: var(--bark); overflow: hidden; text-overflow: ellipsis; }
.key { height: 22px; font-size: 12px; text-overflow: ellipsis; }
.row { display: flex; gap: 6px; align-items: center; } .row > * { flex: 1; }
#panels { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 12px;
  align-content: start; padding: 2px 8px 8px 2px; }
.panel { padding: 6px; min-width: 0; height: 300px; display: flex; flex-direction: column; contain: layout paint; }
.ptitle { display: flex; gap: 6px; align-items: center; background: var(--grass); color: var(--fur-l); padding: 2px 4px;
  text-shadow: 2px 2px 0 var(--ink); }
.ptitle span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptitle em { font-style: normal; font-size: 11px; color: var(--fur-l); opacity: .85; }
.ptitle button { padding: 0 6px; }
.plot { position: relative; flex: 1; margin-top: 6px; border: 3px solid var(--bark-d); background: var(--sky); min-height: 0; cursor: crosshair; }
.plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.tip { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; z-index: 5; background: var(--paper); border: 3px solid var(--bark-d);
  box-shadow: 3px 3px 0 var(--ink); font-size: 11px; padding: 3px 5px; white-space: nowrap; display: none; }
.tip .tiplist { overflow-y: auto; margin: 2px 0; padding-right: 4px; }
.tip .hl { background: var(--snout); outline: 2px solid var(--ink); }
.tip .tipfoot { margin-top: 2px; padding-top: 2px; border-top: 2px dashed var(--bark); color: var(--bark); font-size: 10px; }
.tip i { display: inline-block; width: 9px; height: 9px; border: 1px solid #000; margin-right: 4px; }
#empty { grid-column: 1 / -1; padding: 40px; text-align: center; font-size: 22px; color: var(--fur-l); text-shadow: 3px 3px 0 var(--ink); }
#empty canvas { width: 192px; height: 192px; display: block; margin: 0 auto 12px; }
.muted { color: var(--bark); font-size: 11px; }
#perf { position: fixed; right: 8px; bottom: 4px; font-size: 10px; color: var(--fur-l); text-shadow: 1px 1px 0 #000; pointer-events: none; }
::-webkit-scrollbar { width: 14px; } ::-webkit-scrollbar-thumb { background: var(--snout); border: 3px solid var(--snout-d); }
::-webkit-scrollbar-track { background: var(--fur-d); }
</style>
</head>
<body>
<canvas id="bg" width="96" height="54"></canvas>
<header class="bevel">
  <button id="sidetog" title="hide/show sidebar">◀</button>
  <canvas id="logo" width="28" height="28"></canvas>
  <div class="brand">
    <h1>NIU-LAI-VIZ</h1>
    <div class="tag">grafana for experiments &middot; weights &amp; biases for the poor &middot; 100% /metrics</div>
  </div>
  <div class="ctl pit">
    <label>T=0</label>
    <select id="amode"><option value="start">run start</option><option value="first">first sample of</option><option value="above">first value &gt;</option></select>
    <input id="akey" type="text" placeholder="regex: train_loss$">
    <input id="aval" type="number" value="0" step="any" title="threshold">
    <label>X</label>
    <select id="xmode"><option value="time">time</option><option value="metric">metric</option></select>
    <input id="xkey" type="text" placeholder="trainer/train_step">
    <button id="unzoom" title="or double-click a chart">unzoom</button>
  </div>
  <div id="live" class="pit">OFFLINE</div>
</header>
<main>
  <aside>
    <section id="runs-sec" class="bevel">
      <h2>Runs <small id="runcount"></small></h2>
      <input id="runfilter" type="text" placeholder="filter: lr=3e-4 optimizer=lion">
      <div class="row"><button id="selall">pick shown</button><button id="selnone">pick none</button></div>
      <div id="runs" class="vlist pit"><div class="spacer"></div></div>
    </section>
    <section id="metrics-sec" class="bevel">
      <h2>Metrics <small id="keycount"></small></h2>
      <input id="keyfilter" type="text" placeholder="regex: loss|util">
      <div class="row"><button id="addall">plot matches</button><button id="clear">clear plots</button></div>
      <div class="row muted"><label>smooth <input id="smooth" type="range" min="0" max="0.99" step="0.01" value="0"></label><span id="smoothv">0</span></div>
      <div id="keys" class="vlist pit"><div class="spacer"></div></div>
    </section>
  </aside>
  <div id="panels"><div id="empty"><canvas class="niu" width="28" height="28"></canvas>pick runs, then click a metric. moo.</div></div>
</main>
<div id="perf"></div>
<dialog id="ydlg" class="bevel"><form method="dialog">
  <h2 id="ydlg-t">y axis</h2>
  <label>scale <select id="yscale"><option value="lin">linear</option><option value="log">log</option><option value="symlog">symlog</option></select></label>
  <label>y min <input id="ymin" type="number" step="any" placeholder="auto"></label>
  <label>y max <input id="ymax" type="number" step="any" placeholder="auto"></label>
  <div class="row"><button value="ok">ok</button><button value="auto">auto range</button><button value="cancel" formnovalidate>cancel</button></div>
</form></dialog>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const PAL = { grass: "#5c9a2c", grassD: "#2f5a14", moss: "#9ccc3c", fur: "#e8b923", furD: "#a87a10", furL: "#fff08a",
  snout: "#f49ab8", snoutD: "#c0507a", bark: "#6b4423", barkD: "#3b2310", sky: "#8fd0e8", ink: "#24140a" };
const PX = 2;           // CSS pixels per canvas pixel: the crunch
const MAX_PANELS = 400;

// ---------- low-poly pixel garbage ----------
function rng(seed) { return () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296); }
function drawBackground() {
  const c = $("#bg"), g = c.getContext("2d"), r = rng(7), W = c.width, H = c.height, step = 12, pts = [];
  for (let y = 0; y <= H + step; y += step) { const row = []; for (let x = 0; x <= W + step; x += step) row.push([x + (r() - .5) * step * .9, y + (r() - .5) * step * .9]); pts.push(row); }
  const shades = (y) => y < 1 ? ["#8fd0e8", "#a7dcef", "#7cc0dd"] : y < 2 ? ["#3b2310", "#6b4423", "#4f3218", "#2f5a14"]
    : ["#5c9a2c", "#4a8a22", "#6fae34", "#2f5a14", "#9ccc3c", "#3d7a1a", "#b5c020"];
  for (let y = 0; y < pts.length - 1; y++) for (let x = 0; x < pts[y].length - 1; x++) {
    const a = pts[y][x], b = pts[y][x + 1], d = pts[y + 1][x], e = pts[y + 1][x + 1], sh = shades(y);
    for (const t of [[a, b, e], [a, e, d]]) { g.fillStyle = sh[Math.floor(r() * sh.length)]; g.beginPath(); g.moveTo(...t[0]); g.lineTo(...t[1]); g.lineTo(...t[2]); g.fill(); }
  }
  const img = g.getImageData(0, 0, W, H);
  for (let i = 0; i < img.data.length; i += 4) { const n = (r() - .5) * 38; img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n; }
  g.putImageData(img, 0, 0);
  for (let i = 0; i < 40; i++) { g.fillStyle = r() < .6 ? PAL.fur : PAL.snout; g.fillRect(Math.floor(r() * W), 20 + Math.floor(r() * (H - 20)), 1, 1); }
}
// Crude low-poly Niu Lai head on a 28x28 grid. yaw 0..1 turns it toward the charts
// (right/down); nod shifts it down in whole pixels. Nearer facets move further: fake 3D.
function drawNiu(c, yaw = 0, nod = 0) {
  const g = c.getContext("2d");
  const P = (depth, col, ...p) => { g.fillStyle = col; g.beginPath();
    const dx = yaw * depth, dy = yaw * depth * 0.35 + nod * Math.min(1, depth / 2);
    for (let i = 0; i < p.length; i += 2) (i ? g.lineTo : g.moveTo).call(g, Math.round(p[i] + dx), Math.round(p[i + 1] + dy)); g.fill(); };
  g.clearRect(0, 0, 28, 28);
  P(0.5, PAL.furD, 3, 7, 0, 2, 7, 4); P(0.5, PAL.furD, 25, 7, 28, 2, 21, 4);
  P(1, PAL.fur, 4, 6, 14, 2, 24, 6, 26, 15, 22, 23, 14, 26, 6, 23, 2, 15);
  P(1.5, PAL.furL, 14, 2, 24, 6, 18, 11); P(1.5, PAL.furL, 4, 6, 14, 2, 9, 10);
  P(1, PAL.furD, 2, 15, 6, 23, 8, 16); P(1.2, PAL.furD, 26, 15, 22, 23, 20, 16);
  P(2.5, PAL.ink, 8, 11, 11, 10, 11, 13, 8, 13); P(2.5, PAL.ink, 17, 10, 20, 11, 20, 13, 17, 13);
  P(3.5, "#fff", 9, 11, 10, 11, 10, 12, 9, 12); P(3.5, "#fff", 18, 11, 19, 11, 19, 12, 18, 12);
  P(3, PAL.snout, 7, 17, 14, 14, 21, 17, 19, 23, 14, 24, 9, 23); P(3, PAL.snoutD, 7, 17, 9, 23, 11, 19);
  P(3, PAL.snoutD, 11, 18, 13, 18, 13, 20, 11, 20); P(3, PAL.snoutD, 16, 18, 18, 18, 18, 20, 16, 20);
}
// Turn to look at the charts, nod slowly, glance back, repeat. 8 fps on a 28px canvas.
function animateNiu(c) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return drawNiu(c);
  const t0 = performance.now(); let last = "";
  setInterval(() => {
    if (document.hidden) return;
    const t = ((performance.now() - t0) / 1000) % 14;
    let yaw = t < 1.2 ? t / 1.2 : t < 11 ? 1 : t < 12 ? 1 - (t - 11) : 0; yaw = yaw * yaw * (3 - 2 * yaw);
    const nod = t >= 1.2 && t < 11 ? Math.round((1 - Math.cos((t - 1.2) * Math.PI * 2 / 2.8)) * 1.1) : 0;
    const key = Math.round(yaw * 8) + ":" + nod; if (key === last) return; last = key;
    drawNiu(c, yaw, nod);
  }, 125);
}

// ---------- state ----------
const ls = (k, d) => { try { return JSON.parse(localStorage.getItem("niu." + k)) ?? d; } catch { return d; } };
const S = {
  runs: [], runByName: new Map(), shownRuns: [], picked: new Set(ls("picked", [])), firstLoad: localStorage.getItem("niu.picked") === null,
  keys: [], shownKeys: [], panels: ls("panels", []), smooth: 0, view: null,
  align: ls("align", { mode: "start", key: "", above: 0 }), xkey: ls("xkey", ""), wide: new Set(ls("wide", [])), yopt: ls("yopt", {}),
};
const save = () => { for (const k of ["picked", "panels", "align", "xkey", "wide", "yopt"]) localStorage.setItem("niu." + k, JSON.stringify(k === "picked" || k === "wide" ? [...S[k]] : S[k])); };
// Garish run colors, handed out oldest-first so a run keeps its color as new runs appear.
const RUN_COLORS = ["#ff00ff", "#0047ff", "#ff6a00", "#7a00ff", "#d40000", "#008a3e", "#e6d000", "#8b4513", "#00c9b0", "#ff3d8b", "#5a7d00", "#00a2ff"];
const colorCache = new Map();
function color(name) {
  let c = colorCache.get(name);
  if (!c) { const i = colorCache.size; c = i < RUN_COLORS.length ? RUN_COLORS[i] : `hsl(${(i * 137.508) % 360},${80 + (i % 3) * 10}%,${36 + (i % 4) * 6}%)`; colorCache.set(name, c); }
  return c;
}
const rgbaCache = new Map(), rgbaCtx = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
function rgba(css) {
  let v = rgbaCache.get(css);
  if (v === undefined) { rgbaCtx.clearRect(0, 0, 1, 1); rgbaCtx.fillStyle = css; rgbaCtx.fillRect(0, 0, 1, 1); const p = rgbaCtx.getImageData(0, 0, 1, 1).data;
    v = new Uint32Array(new Uint8ClampedArray([p[0], p[1], p[2], 255]).buffer)[0]; rgbaCache.set(css, v); }
  return v;
}
const SKY = rgba(PAL.sky), GRID = rgba("#6f9aa3");
const api = (path, body, signal) => fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), signal } : { signal });
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- virtual lists: only visible rows exist in the DOM ----------
class VList {
  constructor(el, rowH, render) {
    this.el = el; this.rowH = rowH; this.render = render; this.items = []; this.spacer = el.firstElementChild; this.pool = [];
    el.addEventListener("scroll", () => this.schedule(), { passive: true });
    new ResizeObserver(() => this.schedule()).observe(el);
  }
  set(items) { this.items = items; this.spacer.style.height = items.length * this.rowH + "px"; this.schedule(true); }
  schedule(force) { if (force) this.force = true; if (!this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; this.draw(); }); }
  draw() {
    const top = this.el.scrollTop, h = this.el.clientHeight, a = Math.max(0, Math.floor(top / this.rowH) - 4), b = Math.min(this.items.length, Math.ceil((top + h) / this.rowH) + 4);
    if (!this.force && a === this.a && b === this.b) return;
    this.force = false; this.a = a; this.b = b;
    while (this.pool.length < b - a) { const d = document.createElement("div"); this.el.appendChild(d); this.pool.push(d); }
    for (let i = 0; i < this.pool.length; i++) {
      const d = this.pool[i], j = a + i;
      if (j < b) { d.style.display = ""; d.style.transform = `translateY(${j * this.rowH}px)`; this.render(d, this.items[j], j); }
      else d.style.display = "none";
    }
  }
}
function matchesFilter(run, toks) {
  return toks.every((tok) => { const eq = tok.indexOf("=");
    if (eq < 0) return run.name.includes(tok) || run._lab.includes(tok);
    return (run.labels[tok.slice(0, eq)] ?? "").includes(tok.slice(eq + 1)); });
}
const runList = new VList($("#runs"), 34, (d, run) => {
  d.className = "vrow run" + (S.picked.has(run.name) ? " on" : "");
  d.dataset.name = run.name;
  const st = run.status === "running" ? "LIVE" : run.status;
  if (d._sig !== run.name + st) {
    d._sig = run.name + st;
    d.innerHTML = `<div class="top"><div class="swatch" style="background:${color(run.name)}"></div><div class="nm">${esc(run.name)}</div><div class="status ${run.status}">${st}</div></div><div class="labels">${esc(run._lab)}</div>`;
  }
});
const keyList = new VList($("#keys"), 22, (d, key) => { d.className = "vrow key" + (S.panelSet.has(key) ? " on" : ""); if (d.textContent !== key) { d.textContent = key; d.title = key; } d.dataset.key = key; });
$("#runs").addEventListener("click", (e) => { const r = e.target.closest(".run"); if (r) togglePick(r.dataset.name); });
$("#keys").addEventListener("click", (e) => { const r = e.target.closest(".key"); if (r) { const k = r.dataset.key; S.panelSet.has(k) ? removePanel(k) : addPanels([k], true); } });

function filterRuns() {
  const toks = $("#runfilter").value.trim().split(/\s+/).filter(Boolean);
  S.shownRuns = toks.length ? S.runs.filter((r) => matchesFilter(r, toks)) : S.runs;
  runList.set(S.shownRuns);
  $("#runcount").textContent = `${S.picked.size}/${S.runs.length}`;
}
function filterKeys() {
  let re; try { re = new RegExp($("#keyfilter").value, "i"); } catch { re = null; }
  S.shownKeys = !re ? [] : $("#keyfilter").value ? S.keys.filter((k) => re.test(k)) : S.keys;
  keyList.set(S.shownKeys);
  $("#keycount").textContent = `${S.shownKeys.length}/${S.keys.length}`;
}

// ---------- server sync ----------
async function refreshRuns() {
  const runs = await (await api("/api/runs")).json();
  for (const r of runs) r._lab = Object.entries(r.labels).map(([k, v]) => `${k}=${v}`).join(" ");
  [...runs].sort((a, b) => a.started_at_ms - b.started_at_ms || (a.name < b.name ? -1 : 1)).forEach((r) => color(r.name));
  S.runs = runs; S.runByName = new Map(runs.map((r) => [r.name, r]));
  if (S.firstLoad && runs.length) { runs.slice(0, 50).forEach((r) => S.picked.add(r.name)); S.firstLoad = false; save(); }
  for (const n of [...S.picked]) if (!S.runByName.has(n)) S.picked.delete(n);
  filterRuns();
  const live = runs.filter((r) => r.live).length;
  $("#live").textContent = live ? `\u25CF ${live} LIVE` : "NO LIVE RUNS";
  $("#live").classList.toggle("on", live > 0);
}
let keysCtl;
async function refreshKeys() {
  keysCtl?.abort(); keysCtl = new AbortController();
  try { const res = await (await api("/api/keys", { runs: [...S.picked] }, keysCtl.signal)).json(); S.keys = res.keys; filterKeys(); } catch (e) { if (e.name !== "AbortError") throw e; }

    if (t > lastTop + 4 && t > 60 && room) setHdr(true); else if (t < lastTop - 4 || t < 20) setHdr(false);
  }
  lastTop = t;
}, { passive: true });
function setSide(hidden) { document.body.classList.toggle("noside", hidden); $("#sidetog").textContent = hidden ? "▶" : "◀"; localStorage.setItem("niu.noside", JSON.stringify(hidden)); }
$("#sidetog").onclick = () => setSide(!document.body.classList.contains("noside"));
setSide(ls("noside", false));

S.panelSet = new Set(S.panels);
function addPanels(keys, scroll) {
  keys = keys.filter((k) => !S.panelSet.has(k)).slice(0, MAX_PANELS - S.panels.length);
  const frag = document.createDocumentFragment();
  for (const key of keys) {
    S.panels.push(key); S.panelSet.add(key);
    const p = document.createElement("div"); p.className = "panel bevel";
    p.innerHTML = `<div class="ptitle"><span></span><em></em><button class="sbtn" title="y scale: lin → log → symlog">lin</button><button class="ybtn" title="set y min/max">y↕</button><button class="wbtn" title="full width">⇔</button><button class="xbtn">x</button></div><div class="plot"><div class="tip"></div></div>`;
    if (S.wide.has(key)) p.classList.add("wide");
    const title = p.querySelector(".ptitle"); title.draggable = true; title.title = "drag to reorder";
    title.addEventListener("dragstart", (e) => { dragKey = key; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", key); p.classList.add("dragging"); });
    title.addEventListener("dragend", () => { p.classList.remove("dragging"); clearDrop(); dragKey = null; });
    p.querySelector(".sbtn").onclick = () => { const o = S.yopt[key] || {}, order = ["lin", "log", "symlog"]; setYopt(key, { ...o, scale: order[(order.indexOf(o.scale || "lin") + 1) % 3] }); };
    p.querySelector(".ybtn").onclick = () => openYDialog(key);
    p.querySelector(".wbtn").onclick = () => { const on = p.classList.toggle("wide"); on ? S.wide.add(key) : S.wide.delete(key); save(); };
    p.querySelector("span").textContent = key; p.querySelector("span").title = key;
    p.querySelector(".xbtn").onclick = () => removePanel(key);
    frag.appendChild(p);
    const c = new Chart(key, p); p._chart = c; charts.set(key, c); c.sbtn = p.querySelector(".sbtn"); c.ybtn = p.querySelector(".ybtn");
    c.sbtn.textContent = (S.yopt[key] || {}).scale || "lin"; c.ybtn.classList.toggle("on", S.yopt[key]?.min != null || S.yopt[key]?.max != null);
  }
  $("#panels").appendChild(frag);
  if (scroll && keys.length) charts.get(keys[0]).panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  for (const k of keys) { const p = charts.get(k).panel; vis.observe(p); ro.observe(p.querySelector(".plot")); }
  $("#empty").style.display = S.panels.length ? "none" : ""; save(); keyList.schedule(true); pump();
}
function removePanel(key) {
  S.wide.delete(key);
  const c = charts.get(key); if (!c) return; c.destroy(); vis.unobserve(c.panel); ro.unobserve(c.plot); c.panel.remove(); charts.delete(key);
  S.panels = S.panels.filter((k) => k !== key); S.panelSet.delete(key); $("#empty").style.display = S.panels.length ? "none" : ""; save(); keyList.schedule(true);
}
const picksChanged = debounce(() => { invalidate(true); refreshKeys(); }, 150);
function togglePick(name) { S.picked.has(name) ? S.picked.delete(name) : S.picked.add(name); save(); runList.schedule(true); $("#runcount").textContent = `${S.picked.size}/${S.runs.length}`; picksChanged(); }

// ---------- per-metric y axis ----------
function setYopt(key, o) {
  if (!o.scale || o.scale === "lin") delete o.scale; if (o.min == null) delete o.min; if (o.max == null) delete o.max;
  if (Object.keys(o).length) S.yopt[key] = o; else delete S.yopt[key];
  save(); const c = charts.get(key); if (c) { c.prep(); c.draw(); }
}
function openYDialog(key) {
  const dlg = $("#ydlg"), o = S.yopt[key] || {};
  $("#ydlg-t").textContent = key; $("#yscale").value = o.scale || "lin"; $("#ymin").value = o.min ?? ""; $("#ymax").value = o.max ?? "";
  dlg.onclose = () => {
    const num = (id) => $(id).value === "" ? null : +$(id).value;
    if (dlg.returnValue === "ok") setYopt(key, { scale: $("#yscale").value, min: num("#ymin"), max: num("#ymax") });
    else if (dlg.returnValue === "auto") setYopt(key, { scale: $("#yscale").value });
  };
  dlg.returnValue = ""; dlg.showModal(); $("#ymin").focus();
}

// ---------- drag to reorder ----------
let dragKey = null;
function clearDrop() { for (const el of document.querySelectorAll(".drop-before,.drop-after")) el.classList.remove("drop-before", "drop-after"); }
$("#panels").addEventListener("dragover", (e) => {
  const t = e.target.closest(".panel"); if (!dragKey || !t || t._chart.key === dragKey) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  const r = t.getBoundingClientRect(), after = e.clientX - r.left > r.width / 2;
  if (!t.classList.contains(after ? "drop-after" : "drop-before")) { clearDrop(); t.classList.add(after ? "drop-after" : "drop-before"); }
});
$("#panels").addEventListener("drop", (e) => {
  const t = e.target.closest(".panel"), src = dragKey && charts.get(dragKey)?.panel; if (!t || !src || t === src) return;
  e.preventDefault(); t.classList.contains("drop-after") ? t.after(src) : t.before(src); clearDrop();
  S.panels = [...$("#panels").querySelectorAll(".panel")].map((p) => p._chart.key); save();
});

// ---------- live ----------
const changed = new Set();
const onLive = debounce(async () => {
  const runs = [...changed]; changed.clear();
  await refreshRuns();
  if (runs.some((r) => S.picked.has(r))) { invalidate(false); refreshKeysSoon(); }
}, 400);
function connect() {
  const es = new EventSource("/api/events");
  es.addEventListener("run", (e) => { changed.add(e.data); onLive(); });
  es.onerror = () => { $("#live").textContent = "SERVER GONE"; $("#live").classList.remove("on"); };
  es.onopen = () => onLive();
}

// ---------- perf HUD ----------
const perf = { n: 0, net: 0, bytes: 0, dn: 0, dsum: 0, dmax: 0,
  note(net, b) { this.n++; this.net += net; this.bytes += b; this.show(); },
  drawn(ms) { this.dn++; this.dsum += ms; this.dmax = Math.max(this.dmax, ms); this.show(); },
  show: debounce(() => { const p = perf; $("#perf").textContent = `${p.n} loads \u00b7 avg net ${(p.net / Math.max(1, p.n)).toFixed(0)}ms \u00b7 ${(p.bytes / Math.max(1, p.n) / 1024).toFixed(0)}KB/chart \u00b7 draw avg ${(p.dsum / Math.max(1, p.dn)).toFixed(2)}ms max ${p.dmax.toFixed(1)}ms`; }, 250) };

// ---------- wiring ----------
$("#runfilter").oninput = debounce(filterRuns, 60);
$("#keyfilter").oninput = debounce(filterKeys, 60);
$("#selall").onclick = () => { S.picked = new Set(S.shownRuns.map((r) => r.name)); save(); filterRuns(); picksChanged(); };
$("#selnone").onclick = () => { S.picked.clear(); save(); filterRuns(); picksChanged(); };
$("#addall").onclick = () => addPanels(S.shownKeys, true);
$("#clear").onclick = () => { for (const k of [...S.panels]) removePanel(k); };
$("#smooth").oninput = (e) => { S.smooth = +e.target.value; $("#smoothv").textContent = S.smooth.toFixed(2); smoothSoon(); };
const smoothSoon = debounce(() => invalidate(true), 120);
$("#unzoom").onclick = () => setView(null);
const alignChanged = debounce(() => { S.align = { mode: $("#amode").value, key: $("#akey").value, above: +$("#aval").value };
  S.xkey = $("#xmode").value === "metric" ? $("#xkey").value : ""; save(); setView(null); }, 300);
for (const id of ["amode", "akey", "aval", "xmode", "xkey"]) $("#" + id).addEventListener("input", alignChanged);
$("#amode").value = S.align.mode; $("#akey").value = S.align.key; $("#aval").value = S.align.above;
$("#xmode").value = S.xkey ? "metric" : "time"; $("#xkey").value = S.xkey;

window.niu = { charts, S, frameWork, FRAME_BUDGET }; // for benchmarks and console poking
drawBackground(); animateNiu($("#logo")); document.querySelectorAll(".niu").forEach(drawNiu);
(async () => {
  await refreshRuns();
  await refreshKeys();
  const initial = S.panels.length ? S.panels : S.keys.filter((k) => /loss|grad_norm|learning_rate|utilization.*gpu=0|eval_acc/.test(k)).slice(0, 6);
  S.panels = []; S.panelSet = new Set(); addPanels(initial);
  connect();
})();
</script>
</body>
</html>
