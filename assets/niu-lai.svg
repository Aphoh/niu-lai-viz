<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 36 32" width="240" height="213" shape-rendering="crispEdges">
  <title>niu-lai</title>
  <style>
    /* CSS-only animation: GitHub renders this through an img tag, so no scripts. */
    .head  { animation: sway 5.5s steps(22) infinite, nod 2.6s steps(8) infinite; transform-origin: 14px 26px; }
    .ears  { animation: ears 5.5s steps(22) infinite; }
    .face  { animation: look 5.5s steps(22) infinite; }
    .pupil { animation: peek 5.5s steps(22) infinite; }
    .blink { animation: blink 4.1s steps(1) infinite; transform-origin: 14px 12px; }
    @keyframes sway { 0%,100% { transform: translateX(-1px) skewY(-3deg); } 50% { transform: translateX(1px) skewY(3deg); } }
    @keyframes nod  { 0%,100% { translate: 0 0; } 50% { translate: 0 1.2px; } }
    @keyframes ears { 0%,100% { transform: translateX(0.6px); } 50% { transform: translateX(-0.6px); } }
    @keyframes look { 0%,100% { transform: translate(-2.2px,0.4px); } 50% { transform: translate(2.2px,1px); } }
    @keyframes peek { 0%,100% { transform: translateX(-0.6px); } 50% { transform: translateX(0.6px); } }
    @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.15); } }
  </style>
  <g class="head">
    <g class="ears">
      <polygon fill="#b8860b" points="3,7 -2,1 7,4"/>
      <polygon fill="#b8860b" points="25,7 30,1 21,4"/>
    </g>
    <polygon fill="#e8b923" points="4,6 14,2 24,6 26,15 22,23 14,26 6,23 2,15"/>
    <polygon fill="#fde68a" points="14,2 24,6 18,11"/>
    <polygon fill="#fde68a" points="4,6 14,2 9,10"/>
    <polygon fill="#b8860b" points="2,15 6,23 8,16"/>
    <polygon fill="#b8860b" points="26,15 22,23 20,16"/>
    <g class="face">
      <g class="blink">
        <polygon fill="#24140a" points="8,11 11,10 11,13 8,13"/>
        <polygon fill="#24140a" points="17,10 20,11 20,13 17,13"/>
        <g class="pupil" fill="#fff"><rect x="9" y="11" width="1" height="1"/><rect x="18" y="11" width="1" height="1"/></g>
      </g>
      <polygon fill="#f49ab8" points="7,17 14,14 21,17 19,23 14,24 9,23"/>
      <polygon fill="#d4668c" points="7,17 9,23 11,19"/>
      <rect fill="#d4668c" x="11" y="18" width="2" height="2"/>
      <rect fill="#d4668c" x="16" y="18" width="2" height="2"/>
    </g>
  </g>
</svg>
